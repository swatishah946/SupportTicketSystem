# Single origin: the SPA and the API are served from the same host, so auth
# cookies are first-party and no CORS is needed in production.

# Keep the scheme set by an upstream TLS terminator (Render, Cloudflare, a
# host-level Caddy), falling back to this hop's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Google's sign-in button rejects plain-http pages (local testing) unless they send
# this policy; real deployments run on https and keep the stricter default.
map $forwarded_proto $referrer_policy {
    https   "strict-origin-when-cross-origin";
    default "no-referrer-when-downgrade";
}

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy $referrer_policy always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # LLM calls are bounded server-side (LLM_TIMEOUT_SECONDS); leave headroom.
        proxy_read_timeout 30s;
    }

    # WebSockets: forward the HTTP "Upgrade" handshake and keep the connection open.
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
    }

    # Cache headers use `expires`, not add_header: any add_header inside a
    # location would stop the server-level security headers being inherited.

    # Fingerprinted build assets never change: cache them hard.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        expires -1;
    }
}
