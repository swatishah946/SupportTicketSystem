# Local development: hot-reload frontend + Django runserver + Celery worker/beat + Postgres + Redis.
#   cp .env.example .env && docker compose up --build
#   open http://localhost:5173
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusdesk}
      POSTGRES_USER: ${POSTGRES_USER:-nexusdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusdesk-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # reachable from this machine only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DEBUG: "True"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusdesk}:${POSTGRES_PASSWORD:-nexusdesk-dev}@db:5432/${POSTGRES_DB:-nexusdesk}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A ticket_system worker --beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      DEBUG: "True"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusdesk}:${POSTGRES_PASSWORD:-nexusdesk-dev}@db:5432/${POSTGRES_DB:-nexusdesk}
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      disable: true
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

volumes:
  postgres_data:
