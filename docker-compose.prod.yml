# Production-style stack: nginx (SPA + reverse proxy) -> gunicorn/Django -> Postgres,
# Redis (cache, throttling, Celery broker), a Celery worker for AI jobs and
# Celery beat for periodic SLA escalation.
#   cp .env.example .env   # set SECRET_KEY, POSTGRES_PASSWORD, ALLOWED_HOSTS, ...
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusdesk}
      POSTGRES_USER: ${POSTGRES_USER:-nexusdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend: &backend
    build: ./backend
    env_file: .env
    environment:
      DEBUG: "False"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusdesk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexusdesk}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Runs LLM triage + embeddings off the request path, with retries.
  worker:
    <<: *backend
    command: celery -A ticket_system worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD-SHELL", "celery -A ticket_system inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 15s
    depends_on:
      backend:
        condition: service_healthy

  # Schedules SLA escalation (every ESCALATION_INTERVAL_SECONDS, default 300).
  beat:
    <<: *backend
    command: celery -A ticket_system beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
